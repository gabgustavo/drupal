curso_module.primer_ruta:
  path: '/curso/controller/pagina/{pagina}'
  defaults:
    _controller: '\Drupal\curso_module\Controller\CursoController::home'
  requirements:
    _permission: 'access content'
curso_module.segunda_ruta:
  path: '/curso/controller/pagina-dinamica/{node}'
  defaults:
    _controller: '\Drupal\curso_module\Controller\CursoController::homeDinamico'
  requirements:
    _permission: 'access content'
curso_module.tercer_ruta:
  path: '/curso/controller/pagina-manual/{node}'
  defaults:
    _controller: '\Drupal\curso_module\Controller\CursoController::homeManual'
  requirements:
    _permission: 'access content'

curso_module.cuarta_ruta:
  path: '/curso/controller/pagina-dinamica-dos/{node}'
  defaults:
    _controller: '\Drupal\curso_module\Controller\CursoController::homeDinamicoDos'
  requirements:
    _permission: 'access content'

curso_module.curso_form:
  path: '/curso/form/formulario'
  defaults:
    _form: '\Drupal\curso_module\Form\CursoForm'
  requirements:
    _permission: 'access content'

curso_module.ruta_con_fromulario:
  path: '/curso/controller/form'
  defaults:
    _controller: '\Drupal\curso_module\Controller\CursoController::formController'
  requirements:
    _permission: 'access content'
